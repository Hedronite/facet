[package]
name = "facet-lattice"
# Pinned to the live crates.io release. Do NOT bump to match the Facet
# CLI version; the lattice crate identity is its own version axis.
version = "0.5.9"
edition.workspace = true
license = "MIT"
rust-version.workspace = true
description = "Facet run-history store: SQLite beside OpenCollection YAML"
readme = "README.md"
repository = "https://github.com/Hedronite/facet"
homepage = "https://github.com/Hedronite/facet"
keywords = ["facet", "api-client", "sqlite", "opencollection", "run-history"]
categories = ["database", "development-tools"]
publish = true

[lib]
name = "lattice"

[dependencies]
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
directories = "6"
hkdf = "0.13.0"
hmac = "0.13.0"
keyring = "4.2.0"
# Optional SQLite analytics smoke; bundled DuckDB is a heavy native build.
# Keep this off in ordinary installations and budget build-host resources.
duckdb = { version = "1.10505.0", optional = true, features = ["bundled"] }
rand = "0.9"
rusqlite = { version = "0.40", features = ["bundled", "hooks"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
toml = "1"

[dev-dependencies]
rusqlite = { version = "0.40", features = ["bundled", "hooks"] }
tempfile = "3"

[features]
default = []
# Optional in-process analytics against SQLite stores.
lattice-duckdb = ["dep:duckdb"]

# Optional heavy analytics smoke.
[[test]]
name = "duckdb"
required-features = ["lattice-duckdb"]

[lints]
workspace = true
