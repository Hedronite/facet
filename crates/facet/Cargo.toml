[package]
name = "facet-cli"
version.workspace = true
edition.workspace = true
license = "MIT"
rust-version.workspace = true
description = "Facet: Probe cut for the terminal, with Lattice underneath"
publish = false

[[bin]]
name = "facet"
path = "src/main.rs"

[dependencies]
crossterm = "0.29"
facet-record = { path = "../facet-record" }
facet-tui = { path = "../facet-tui" }
facet-lattice = { path = "../lattice" }
# The only Nickel VM on the platform: in-process, never a `nickel` subprocess.
hedron-ncl = { path = "../hedron-ncl" }
# Git pin so CI can resolve without a sibling clone (PR #28 CI).
hedron-core = { git = "https://github.com/VirtualMachinist/hedrondb.git", rev = "f4bc4dc31fb4e09671c629a6731b746413247c95" }
serde_yaml = "0.9"
rusqlite = { version = "0.42", features = ["bundled"] }
probe-cli = { path = "../cli" }
probe-core = { path = "../core" }
probe-http = { path = "../http" }
probe-opencollection = { path = "../opencollection" }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "macros", "time", "signal"] }

[dev-dependencies]
rusqlite = { version = "0.42", features = ["bundled"] }
tempfile = "3"

[lints]
workspace = true
