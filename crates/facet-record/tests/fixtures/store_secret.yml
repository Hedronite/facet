opencollection: 1.0.0
info:
  name: Store secret fixture
bundled: true
config:
  environments:
    - name: local
      variables:
        - name: serverUrl
          value: __COLLECTION_URL__
        - name: apiKey
          value: g5-plain-default
items:
  - info:
      name: Declared plain, redirect
      type: http
      seq: 1
    http:
      method: GET
      url: "{{serverUrl}}/secret"
      headers:
        - name: X-Key
          value: "{{apiKey}}"
  - info:
      name: Declared plain, proxied
      type: http
      seq: 2
    http:
      method: GET
      url: "http://n2-proxy-target.invalid/secret"
      headers:
        - name: X-Key
          value: "{{apiKey}}"
  - info:
      name: Undeclared, redirect
      type: http
      seq: 3
    http:
      method: GET
      url: "{{serverUrl}}/secret"
      headers:
        - name: X-Key
          value: "{{ghost}}"
  - info:
      name: Undeclared, proxied
      type: http
      seq: 4
    http:
      method: GET
      url: "http://n2-proxy-target.invalid/secret"
      headers:
        - name: X-Key
          value: "{{ghost}}"
  - info:
      name: Plain, redirect
      type: http
      seq: 5
    http:
      method: GET
      url: "{{serverUrl}}/plain"
  - info:
      name: Plain, proxied
      type: http
      seq: 6
    http:
      method: GET
      url: "http://n2-proxy-target.invalid/plain"
