opencollection: 1.0.0
info:
  name: Transport lock fixture
bundled: true
config:
  environments:
    - name: local
      variables:
        - name: tag
          value: lock-tag-plain
        - secret: true
          name: token
          type: string
items:
  - info:
      name: Plain
      type: http
      seq: 1
    http:
      method: GET
      url: "__COLLECTION_URL__/plain"
  - info:
      name: Secret
      type: http
      seq: 2
    http:
      method: GET
      url: "__COLLECTION_URL__/secret"
      headers:
        - name: X-Token
          value: "{{token}}"
  - info:
      name: Tagged
      type: http
      seq: 3
    http:
      method: GET
      url: "__COLLECTION_URL__/tagged"
      headers:
        - name: X-Tag
          value: "{{tag}}"
  - info:
      name: Malformed reference
      type: http
      seq: 4
    http:
      method: GET
      url: "__COLLECTION_URL__/malformed?q={{}}"
