opencollection: 1.0.0
info:
  name: Secret transport fixture
bundled: true
config:
  environments:
    - name: local
      variables:
        - secret: true
          name: token
          type: string
items:
  - info:
      name: Secret redirect
      type: http
      seq: 1
    http:
      method: GET
      url: "__COLLECTION_URL__/secret"
      headers:
        - name: X-Token
          value: "{{token}}"
  - info:
      name: Secret proxied
      type: http
      seq: 2
    http:
      method: GET
      url: "http://n2-proxy-target.invalid/secret"
      headers:
        - name: X-Token
          value: "{{token}}"
  - info:
      name: Plain redirect
      type: http
      seq: 3
    http:
      method: GET
      url: "__COLLECTION_URL__/plain"
  - info:
      name: Plain proxied
      type: http
      seq: 4
    http:
      method: GET
      url: "http://n2-proxy-target.invalid/plain"
  - info:
      name: Secret redirect, malformed reference
      type: http
      seq: 5
    http:
      method: GET
      url: "__COLLECTION_URL__/secret?q={{}}"
      headers:
        - name: X-Token
          value: "{{token}}"
  - info:
      name: Secret proxied, malformed reference
      type: http
      seq: 6
    http:
      method: GET
      url: "http://n2-proxy-target.invalid/secret?q={{}}"
      headers:
        - name: X-Token
          value: "{{token}}"
