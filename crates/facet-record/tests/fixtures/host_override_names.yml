opencollection: 1.0.0
info:
  name: Host override names fixture
bundled: true
config:
  environments:
    - name: local
      variables:
        - name: apiUrl
          value: __COLLECTION_URL__
        - name: host
          value: __COLLECTION_AUTHORITY__
        - name: ServerURL
          value: __COLLECTION_URL__
        - name: BASEURL
          value: __COLLECTION_URL__
        - name: serverurl
          value: __COLLECTION_URL__
        - secret: true
          name: token
          type: string
items:
  - info:
      name: Secret via apiUrl
      type: http
      seq: 1
    http:
      method: GET
      url: "{{apiUrl}}/secret"
      headers:
        - name: X-Token
          value: "{{token}}"
  - info:
      name: Secret via host authority
      type: http
      seq: 2
    http:
      method: GET
      url: "http://{{host}}/secret"
      headers:
        - name: X-Token
          value: "{{token}}"
  - info:
      name: Secret via ServerURL
      type: http
      seq: 3
    http:
      method: GET
      url: "{{ServerURL}}/secret"
      headers:
        - name: X-Token
          value: "{{token}}"
  - info:
      name: Secret via BASEURL
      type: http
      seq: 4
    http:
      method: GET
      url: "{{BASEURL}}/secret"
      headers:
        - name: X-Token
          value: "{{token}}"
  - info:
      name: Secret via serverurl
      type: http
      seq: 5
    http:
      method: GET
      url: "{{serverurl}}/secret"
      headers:
        - name: X-Token
          value: "{{token}}"
