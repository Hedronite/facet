opencollection: 1.0.0
info:
  name: Host override fixture
bundled: true
config:
  environments:
    - name: local
      variables:
        - name: serverUrl
          value: __COLLECTION_URL__
        - name: baseUrl
          value: __COLLECTION_URL__
        - secret: true
          name: token
          type: string
items:
  - info:
      name: Secret via serverUrl
      type: http
      seq: 1
    http:
      method: GET
      url: "{{serverUrl}}/secret"
      headers:
        - name: X-Token
          value: "{{token}}"
  - info:
      name: Secret via baseUrl
      type: http
      seq: 2
    http:
      method: GET
      url: "{{baseUrl}}/secret"
      headers:
        - name: X-Token
          value: "{{token}}"
  - info:
      name: Plain via serverUrl
      type: http
      seq: 3
    http:
      method: GET
      url: "{{serverUrl}}/plain"
  - info:
      name: Plain via baseUrl
      type: http
      seq: 4
    http:
      method: GET
      url: "{{baseUrl}}/plain"
