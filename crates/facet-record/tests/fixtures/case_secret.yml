opencollection: 1.0.0
info:
  name: Case-only secret name fixture
bundled: true
config:
  environments:
    - name: local
      variables:
        - name: other
          value: g5-other-plain
        - secret: true
          name: token
          type: string
items:
  - info:
      name: Case-only reference
      type: http
      seq: 1
    http:
      method: GET
      url: "__COLLECTION_URL__/case"
      headers:
        - name: X-Token
          value: "{{Token}}"
  - info:
      name: Exact reference
      type: http
      seq: 2
    http:
      method: GET
      url: "__COLLECTION_URL__/exact"
      headers:
        - name: X-Token
          value: "{{token}}"
  - info:
      name: Unrelated reference
      type: http
      seq: 3
    http:
      method: GET
      url: "__COLLECTION_URL__/other"
      headers:
        - name: X-Other
          value: "{{other}}"
