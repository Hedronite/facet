[package]
name = "facet-record"
version.workspace = true
edition.workspace = true
license = "MIT"
rust-version.workspace = true
description = "Facet: shared run-recording path into Lattice for the CLI and TUI"
publish = false

[dependencies]
base64 = "0.23.1"
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
facet-lattice = { path = "../lattice" }
probe-core = { path = "../core" }
probe-http = { path = "../http" }
serde_json = "1"
url = "2.5.8"
zeroize = "1.9.0"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
