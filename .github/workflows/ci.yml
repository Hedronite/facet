name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows CI is a known skip (not a release-blocker):
        # facet goldens compare exact bytes and fail on CRLF (\r\n vs \n)
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install GPUI Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            clang \
            libasound2-dev \
            libfontconfig-dev \
            libglib2.0-dev \
            libssl-dev \
            libvulkan1 \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-x11-dev
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets --all-features
      # No tag on a PR, so gate the pair that exists: Cargo == `facet --version`.
      # The tag leg is enforced on release (.github/workflows/release.yml).
      - name: Version truth (Cargo == facet --version)
        shell: bash
        run: |
          cargo build --release -p facet-cli --bin facet
          ./scripts/version-check.sh --binary target/release/facet

  deny:
    name: cargo-deny (advisories, bans, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      # probe-desktop is excluded until Phase F retires it: gpui pulls in five
      # unmaintained crates (bincode, instant, proc-macro-error2, rustybuzz,
      # ttf-parser). Everything else in the workspace is checked with the
      # cargo-deny defaults plus the single dated ignore in deny.toml.
      - name: cargo deny (workspace minus probe-desktop)
        run: cargo deny --workspace --exclude probe-desktop check advisories bans sources
