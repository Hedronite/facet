name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows CI is a known skip (not a release-blocker):
        # facet goldens compare exact bytes and fail on CRLF (\r\n vs \n)
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Install native Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            clang \
            cmake
      - run: cargo fmt --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-targets --all-features
      - name: Doctests
        run: cargo test --locked --workspace --all-features --doc
      # No tag on a PR, so gate the pair that exists: Cargo == `facet --version`.
      # The tag leg is enforced on release (.github/workflows/release.yml).
      - name: Version truth (Cargo == facet --version)
        shell: bash
        run: |
          cargo build --release -p facet-cli --bin facet
          ./scripts/version-check.sh --binary target/release/facet

  deny:
    name: cargo-deny (advisories, bans, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-deny
      # The whole workspace is checked with the cargo-deny defaults plus the
      # single dated ignore in deny.toml. (probe-desktop was retired in Phase F.)
      - name: cargo deny (full workspace)
        run: cargo deny --workspace check advisories bans sources

  action-pins:
    name: Action pins (40-hex SHA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pin checker probes
        run: scripts/check-action-pins.sh --probes
      - name: Workflows are pinned
        run: scripts/check-action-pins.sh
